<!doctype html>
<html lang="ko" class="live-document">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=auto" />
    <meta name="theme-color" content="#f4f5f1" />
    <script src="/serial-page-theme.js"></script>
    <meta name="robots" content="noindex" />
    <title>Live</title>
    <link rel="icon" href="/favicon.svg?v=8" type="image/svg+xml" />
    <link rel="stylesheet" href="/action-button.css?v=3" />
    <link rel="stylesheet" href="/ver2.css?v=117" />
    <link rel="stylesheet" href="/serial-shell.css?v=3" />
    <link rel="stylesheet" href="/live.css?v=29" />
    <script type="module" src="/live.js?v=25"></script>
  </head>
  <body class="serial-shell live-page">
    <header class="masthead">
      <div class="masthead-brand">
        <a class="brand" href="/" aria-label="SERIAL 홈"><img src="/nav-ribbon-rest.png" alt="" width="40" height="40" /></a>
        <p id="section-name">Serial Live</p>
      </div>
      <div class="masthead-actions">
        <span id="connection" class="connection" data-state="connecting" role="status" hidden>연결 중</span>
        <button id="fullscreen" class="action-button action-button--quiet action-button--compact" type="button" hidden>전체 화면</button>
      </div>
    </header>

    <main>
      <div class="intro">
        <div class="intro-title">
          <img id="event-image" alt="" width="56" height="56" hidden />
          <h1 id="title">행사 불러오는 중</h1>
        </div>
        <p id="page-message" role="status" hidden></p>
        <a id="login" class="action-button" href="/login" target="_blank" rel="noopener" hidden>관리자 로그인 ↗</a>
      </div>

      <div id="create" class="setup" hidden>
        <form id="create-form" class="panel">
          <label for="event-name">행사 이름</label>
          <input id="event-name" name="title" maxlength="80" placeholder="행사 이름을 입력해 주세요" required />
          <button class="action-button" type="submit">행사 만들기</button>
          <p class="feedback" role="status"></p>
        </form>
        <section class="panel event-directory" aria-labelledby="event-directory-title">
          <h2 id="event-directory-title" tabindex="-1">만든 행사</h2>
          <p id="event-directory-status" class="feedback" role="status">행사를 불러오는 중…</p>
          <ol id="event-directory-list"></ol>
          <button id="retry-event-directory" class="action-button action-button--quiet action-button--compact" type="button" hidden>다시 불러오기</button>
          <details class="open-event">
            <summary>행사 링크나 코드로 열기</summary>
            <form id="open-form">
              <label for="event-code">참가 링크 또는 10자리 코드</label>
              <input id="event-code" name="code" placeholder="행사 링크 또는 코드" required />
              <button class="action-button action-button--quiet" type="submit">운영 화면 열기</button>
              <p class="feedback" role="status"></p>
            </form>
          </details>
        </section>
      </div>

      <div id="workspace" class="workspace" hidden>
        <aside id="controls" class="panel controls" hidden>
          <div>
            <h2>행사 운영</h2>
            <p id="room-status" class="room-status"></p>
          </div>
          <div class="share">
            <label for="join-link">참가 링크</label>
            <div class="share-field">
              <input id="join-link" readonly />
              <button id="copy-link" class="action-button action-button--quiet action-button--compact" type="button">복사</button>
            </div>
          </div>
          <a id="screen-link" class="action-button" target="_blank" rel="noopener">발표 화면 열기 ↗</a>
          <input id="event-image-file" type="file" accept="image/jpeg,image/png,image/webp" hidden />
          <button id="choose-event-image" class="action-button action-button--quiet" type="button">행사 이미지 올리기</button>
          <button id="toggle-room" class="action-button action-button--quiet" type="button">접수 마감</button>
          <p id="manage-feedback" class="feedback" role="status"></p>
          <a class="switch-room" href="/live/manage">다른 행사 열기</a>
        </aside>

        <section class="feed" aria-labelledby="feed-title">
          <div class="feed-heading">
            <h2 id="feed-title">올라온 글</h2>
            <span id="post-count" class="count"></span>
          </div>
          <p id="empty-feed" class="panel empty">아직 올라온 글이 없어요.</p>
          <ol id="posts" class="posts"></ol>
          <button id="new-questions" class="action-button action-button--compact new-questions" type="button" hidden>새로운 질문</button>
          <div id="typing-row" class="typing-row" hidden>
            <span id="typing-dots" class="typing-dots" aria-hidden="true" hidden><span></span><span></span><span></span></span>
            <span id="typing-status" role="status"></span>
          </div>
          <p id="reaction-feedback" class="feedback" role="status"></p>
        </section>

        <div id="compose-slot" tabindex="-1" hidden>
          <form id="compose" class="panel compose">
            <div class="compose-heading">
              <label id="compose-title" for="post-text">질문이나 의견을 남겨주세요</label>
              <button id="close-compose" class="action-button action-button--quiet action-button--compact" type="button" hidden>닫기</button>
            </div>
            <fieldset id="question-targets" class="question-targets" hidden>
              <legend>질문 대상</legend>
              <div id="speaker-options" class="speaker-options"></div>
            </fieldset>
            <textarea id="post-text" name="text" rows="4" maxlength="280" placeholder="어떤 이야기를 나누고 싶으신가요?" aria-describedby="compose-hint" required></textarea>
            <div class="compose-meta">
              <p id="compose-hint" class="hint">글은 익명으로 행사 화면에 공개됩니다.</p>
              <span id="char-count" class="count" aria-hidden="true">0 / 280</span>
            </div>
            <button class="action-button compose-submit" type="submit">보내기</button>
            <p class="feedback" role="status"></p>
          </form>
        </div>
        <p id="compose-success" class="live-visually-hidden" role="status"></p>
        <p id="closed" class="panel empty" hidden>글 접수가 마감되었습니다.</p>
      </div>
    </main>
    <dialog id="compose-dialog" class="compose-dialog" aria-labelledby="compose-title"></dialog>
    <dialog id="event-action-dialog" class="panel event-action-dialog" aria-labelledby="event-action-title" aria-describedby="event-action-description">
      <form id="event-action-form">
        <h2 id="event-action-title"></h2>
        <p id="event-action-description" class="hint" hidden></p>
        <div id="event-action-name-field">
          <label for="event-action-name">행사 이름</label>
          <input id="event-action-name" name="title" maxlength="80" />
        </div>
        <div class="event-action-buttons">
          <button id="cancel-event-action" class="action-button action-button--quiet" type="button">취소</button>
          <button id="submit-event-action" class="action-button" type="submit">저장</button>
        </div>
        <p class="feedback" role="status"></p>
      </form>
    </dialog>
    <noscript>Serial Live를 사용하려면 JavaScript를 켜 주세요.</noscript>
  </body>
</html>
